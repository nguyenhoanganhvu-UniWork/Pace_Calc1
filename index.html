<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pace Calculator</title>
<link rel="stylesheet" href="style.css">
<script src="https://kit.fontawesome.com/453effc9b0.js" crossorigin="anonymous"></script>
</head>
<body>

<div class="app" data-unit="meter">
  <div class="notif" id="notif" style="display: none;">Nothing for Now!</div>

  <header class="header" id="main-header">
    <a href="records.html" id="history-btn" aria-label="View History" style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #fff; font-size: 1.8rem; cursor: pointer;">
      <i class="fa-solid fa-clock-rotate-left"></i>
    </a>
    <h1>Pace Calculator</h1>
    <button id="reset-btn" aria-label="Reset">&#x21bb;</button>
    <button id="save-btn"><i class="fa-solid fa-floppy-disk"></i></button>
  </header>

  <div class="main-view" id="main-view">
    <div class="stopwatch-display" id="stopwatch-display">00:00:00.00</div>

    <div class="unit-toggle">
      <span class="unit-label-meter">Meters</span>
      <button id="unit-switch" class="switch" data-unit="meter" aria-pressed="false">
        <span class="switch-knob"></span>
      </button>
      <span class="unit-label-yard">Yards</span>
    </div>

    <div class="distance-grid">
      <button class="distance-btn" data-meters="60">60</button>
      <button class="distance-btn" data-meters="100">100</button>
      <button class="distance-btn" data-meters="200">200</button>
      <button class="distance-btn" data-meters="400">400</button>
      <button class="distance-btn" data-meters="800">800</button>
      <button class="distance-btn" data-meters="1000">1.000</button>
    </div>

    <div class="results-list" data-unit-list="meter">
      <div class="result-row" data-meters="60">
        <span class="result-label"><span class="calc-icon"><i class="fa-solid fa-calculator"></i></span>Avg 60</span>
        <span class="result-right">
          <span class="result-time" data-recorded="false">NT</span>
          <span class="record-badge" style="display:none;">0</span>
        </span>
      </div>
      <div class="result-row" data-meters="100">
        <span class="result-label"><span class="calc-icon"><i class="fa-solid fa-calculator"></i></span>Avg 100</span>
        <span class="result-right">
          <span class="result-time" data-recorded="false">NT</span>
          <span class="record-badge" style="display:none;">0</span>
        </span>
      </div>
      <div class="result-row" data-meters="200">
        <span class="result-label"><span class="calc-icon"><i class="fa-solid fa-calculator"></i></span>Avg 200</span>
        <span class="result-right">
          <span class="result-time" data-recorded="false">NT</span>
          <span class="record-badge" style="display:none;">0</span>
        </span>
      </div>
      <div class="result-row" data-meters="400">
        <span class="result-label"><span class="calc-icon"><i class="fa-solid fa-calculator"></i></span>Avg 400</span>
        <span class="result-right">
          <span class="result-time" data-recorded="false">NT</span>
          <span class="record-badge" style="display:none;">0</span>
        </span>
      </div>
      <div class="result-row" data-meters="800">
        <span class="result-label"><span class="calc-icon"><i class="fa-solid fa-calculator"></i></span>Avg 800</span>
        <span class="result-right">
          <span class="result-time" data-recorded="false">NT</span>
          <span class="record-badge" style="display:none;">0</span>
        </span>
      </div>
      <div class="result-row" data-meters="1000">
        <span class="result-label"><span class="calc-icon"><i class="fa-solid fa-calculator"></i></span>Avg 1.000</span>
        <span class="result-right">
          <span class="result-time" data-recorded="false">NT</span>
          <span class="record-badge" style="display:none;">0</span>
        </span>
      </div>
    </div>

    <div class="results-list" data-unit-list="yard" style="display:none;">
      <div class="result-row" data-meters="60">
        <span class="result-label"><span class="calc-icon"><i class="fa-solid fa-calculator"></i></span>Avg 60</span>
        <span class="result-right">
          <span class="result-time" data-recorded="false">NT</span>
          <span class="record-badge" style="display:none;">0</span>
        </span>
      </div>
      <div class="result-row" data-meters="100">
        <span class="result-label"><span class="calc-icon"><i class="fa-solid fa-calculator"></i></span>Avg 100</span>
        <span class="result-right">
          <span class="result-time" data-recorded="false">NT</span>
          <span class="record-badge" style="display:none;">0</span>
        </span>
      </div>
      <div class="result-row" data-meters="200">
        <span class="result-label"><span class="calc-icon"><i class="fa-solid fa-calculator"></i></span>Avg 200</span>
        <span class="result-right">
          <span class="result-time" data-recorded="false">NT</span>
          <span class="record-badge" style="display:none;">0</span>
        </span>
      </div>
      <div class="result-row" data-meters="400">
        <span class="result-label"><span class="calc-icon"><i class="fa-solid fa-calculator"></i></span>Avg 400</span>
        <span class="result-right">
          <span class="result-time" data-recorded="false">NT</span>
          <span class="record-badge" style="display:none;">0</span>
        </span>
      </div>
      <div class="result-row" data-meters="800">
        <span class="result-label"><span class="calc-icon"><i class="fa-solid fa-calculator"></i></span>Avg 800</span>
        <span class="result-right">
          <span class="result-time" data-recorded="false">NT</span>
          <span class="record-badge" style="display:none;">0</span>
        </span>
      </div>
      <div class="result-row" data-meters="1000">
        <span class="result-label"><span class="calc-icon"><i class="fa-solid fa-calculator"></i></span>Avg 1.000</span>
        <span class="result-right">
          <span class="result-time" data-recorded="false">NT</span>
          <span class="record-badge" style="display:none;">0</span>
        </span>
      </div>
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
