<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pace Records</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="records.css">
  <script src="https://kit.fontawesome.com/453effc9b0.js" crossorigin="anonymous"></script>
</head>
<body>

<div class="app" data-unit="meter">

  <header class="header records-header">
    <a href="index.html" id="records-back-btn" aria-label="Go Back" style="text-decoration: none;">
      <i class="fa-solid fa-arrow-left"></i>
    </a>
    <h1>Pace Records</h1>
  </header>

  <div class="profile-card">
    <img src="https://media.istockphoto.com/id/2180951990/vi/anh/doanh-nh%C3%A2n-trung-ni%C3%AAn-h%E1%BA%A1nh-ph%C3%BAc-th%C6%B0%E1%BB%9Fng-th%E1%BB%A9c-trong-v%C4%83n-ph%C3%B2ng.jpg?s=612x612&w=0&k=20&c=g-YEB2LnNtVEZl6Yns0z2u0BFtoxKl4xAH4SqyTeWGM=" alt="Profile Picture" class="profile-img">
    <div class="profile-info">
      <h2>John Anderson</h2>
      <p>Male • 15 yrs • CA • Rabbit Team</p>
    </div>
  </div>

  <div class="unit-toggle">
    <span class="unit-label-meter">Meters</span>
    <button id="records-unit-switch" class="switch" data-unit="meter" aria-pressed="false">
      <span class="switch-knob"></span>
    </button>
    <span class="unit-label-yard">Yards</span>
  </div>

  <div class="results-list" id="records-meter-list" data-unit-list="meter"></div>

  <div class="results-list" id="records-yard-list" data-unit-list="yard" style="display:none;"></div>

</div>

<script src="records.js"></script>
</body>
</html>
